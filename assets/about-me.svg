
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#151515"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#FF4938" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FF4938" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="#050505"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <circle cx="1040" cy="180" r="310" fill="url(#glow)"/>

  <!-- Frame -->
  <rect x="18" y="18" width="1164" height="684" fill="none" stroke="#666" stroke-opacity=".4"/>
  <path d="M18 58V18H58 M1142 18H1182V58 M18 662V702H58 M1142 702H1182V662"
        fill="none" stroke="#FF4938" stroke-width="2"/>

  <!-- Header -->
  <text x="65" y="76" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#F5F5F7">01 /</text>
  <text x="145" y="76" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#FF4938" letter-spacing="2">ABOUT ME</text>
  <path d="M340 67H930" stroke="#777" stroke-opacity=".5"/>
  <text x="1130" y="70" text-anchor="end" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#A1A1AA">PROFILE / 001</text>

  <!-- Abstract geometric element -->
  <g transform="translate(1020 190)">
    <circle r="105" fill="none" stroke="#FF4938" stroke-opacity=".55"/>
    <circle r="82" fill="none" stroke="#FF4938" stroke-opacity=".3"/>
    <circle r="57" fill="none" stroke="#FF4938" stroke-opacity=".45"/>
    <path d="M-120 0H120M0 -120V120" stroke="#FF4938" stroke-opacity=".4"/>
    <circle r="7" fill="#FF4938"/>
    <path d="M-38 -38L38 38M38 -38L-38 38" stroke="#FF4938" stroke-opacity=".35"/>
  </g>

  <!-- Headline -->
  <text x="65" y="185" font-family="Arial,sans-serif" font-size="65" font-weight="800" letter-spacing="-2" fill="#F5F5F7">CURIOUS BY NATURE.</text>
  <text x="65" y="255" font-family="Arial,sans-serif" font-size="65" font-weight="800" letter-spacing="-2" fill="#FF4938">BUILT TO CREATE.</text>

  <!-- Intro copy -->
  <rect x="67" y="290" width="5" height="126" fill="#FF4938"/>
  <g font-family="Arial,sans-serif" font-size="19" fill="#D4D4D8">
    <text x="92" y="318">
      <tspan x="92" dy="0">I'm a Computer Science and Engineering student at Vimal Jyothi</tspan>
      <tspan x="92" dy="29">Engineering College, focused on building thoughtful software</tspan>
      <tspan x="92" dy="29">solutions and solving problems through technology.</tspan>
    </text>
    <text x="92" y="410" fill="#A1A1AA">
      <tspan x="92" dy="0">My interests lie in Artificial Intelligence, Machine Learning, and</tspan>
      <tspan x="92" dy="28">Software Development. I enjoy exploring new technologies,</tspan>
      <tspan x="92" dy="28">experimenting with ideas, and building practical applications.</tspan>
    </text>
  </g>

  <!-- Four information cards -->
  <g font-family="Arial,sans-serif">
    <rect x="65" y="505" width="520" height="82" rx="3" fill="url(#panel)" stroke="#555"/>
    <rect x="600" y="505" width="520" height="82" rx="3" fill="url(#panel)" stroke="#555"/>
    <rect x="65" y="597" width="520" height="82" rx="3" fill="url(#panel)" stroke="#555"/>
    <rect x="600" y="597" width="520" height="82" rx="3" fill="url(#panel)" stroke="#555"/>

    <g fill="#FF4938" font-size="27" font-weight="bold">
      <text x="90" y="555">01</text>
      <text x="625" y="555">02</text>
      <text x="90" y="647">03</text>
      <text x="625" y="647">04</text>
    </g>

    <g fill="#FF4938" font-size="16" font-weight="bold" letter-spacing="1">
      <text x="150" y="539">EDUCATION</text>
      <text x="685" y="539">FOCUS</text>
      <text x="150" y="631">APPROACH</text>
      <text x="685" y="631">MINDSET</text>
    </g>

    <g fill="#D4D4D8" font-size="15">
      <text x="150" y="563">B.Tech · Computer Science &amp; Engineering</text>
      <text x="685" y="563">Artificial Intelligence · Machine Learning</text>
      <text x="150" y="655">Learn · Experiment · Build</text>
      <text x="685" y="655">Always Exploring</text>
    </g>

    <g stroke="#FF4938" stroke-opacity=".65" stroke-width="2">
      <path d="M90 570H130"/>
      <path d="M625 570H665"/>
      <path d="M90 662H130"/>
      <path d="M625 662H665"/>
    </g>
  </g>

  <!-- Footer -->
  <path d="M65 690H1135" stroke="#555" stroke-opacity=".6"/>
  <text x="65" y="714" font-family="Arial,sans-serif" font-size="12" letter-spacing="4" fill="#FF4938">///</text>
  <text x="115" y="714" font-family="Arial,sans-serif" font-size="13" letter-spacing="5" fill="#A1A1AA">LESS TALK. MORE BUILDING.</text>
  <text x="1135" y="714" text-anchor="end" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#666">ASHWATH SHIVA P</text>
</svg>
