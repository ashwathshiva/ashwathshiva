  <g font-family="Arial,sans-serif">
    <rect x="65" y="425" width="520" height="55" rx="3" fill="url(#card)" stroke="#555"/>
    <rect x="600" y="425" width="520" height="55" rx="3" fill="url(#card)" stroke="#555"/>
    <rect x="65" y="490" width="520" height="48" rx="3" fill="url(#card)" stroke="#555"/>
    <rect x="600" y="490" width="520" height="48" rx="3" fill="url(#card)" stroke="#555"/>

