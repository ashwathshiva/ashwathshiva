      <tspan x="92" dy="29">solutions and solving problems through technology.</tspan>
    </text>
    <text x="92" y="345" fill="#A1A1AA" font-size="17">
      <tspan x="92" dy="0">Interested in Artificial Intelligence, Machine Learning and Software</tspan>
      <tspan x="92" dy="27">Development. I enjoy exploring technologies and building practical</tspan>
      <tspan x="92" dy="27">applications through experimentation and continuous learning.</tspan>
    </text>
  </g>

