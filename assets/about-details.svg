
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
    <linearGradient id="card" x2="1" y2="1">
      <stop stop-color="#151515"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="570" fill="#050505"/>
